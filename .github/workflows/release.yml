name: Release

# The workflow is kept on the repository default branch so GitHub registers it
# for tag pushes from the knotes release branch. The tag must exactly match
# manifest.json.version (for example, 1.1.4; no leading v).
#
# Release flow:
#   npm version patch --no-git-tag-version
#   git add package.json package-lock.json manifest.json versions.json
#   git commit -m "chore: bump version"
#   git tag <version>
#   git push origin knotes --tags

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Verify tag and manifest version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(node -p "require('./manifest.json').version")"
          if [[ "$tag" != "$version" ]]; then
            echo "Tag $tag does not match manifest version $version" >&2
            exit 1
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            main.js manifest.json styles.css
