name: Release

# Obsidian and BRAT install/update from a published GitHub Release. The
# generated main.js is built in CI and attached together with manifest.json and
# styles.css; it does not need to be tracked in the source repository.
#
# Cut a release from this repo with:
#   npm version patch --no-git-tag-version
#   git add package.json manifest.json versions.json
#   git commit -m "chore: bump version"
#   git tag <version>             # e.g. 1.1.4; must match manifest.version
#   git push origin knotes --tags # pushes the tag -> fires this workflow

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  # Provenance attestation: id-token mints the OIDC token Sigstore signs the
  # build with; attestations lets the run record it against the repo. Users can
  # then `gh attestation verify main.js --repo ryan-manor/Obsidian-Seek`.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
      - name: Build plugin
        run: |
          npm ci
          npm run build
      # Attest the assets actually built in THIS run, so the provenance binds to
      # the published bytes. Requires the release to ship the CI build (push the
      # tag, let this draft, then publish it) — not a locally-built upload.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css
      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            main.js manifest.json styles.css
